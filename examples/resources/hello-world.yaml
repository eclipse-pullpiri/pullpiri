apiVersion: v1
kind: Scenario
metadata:
  name: hello
spec:
  condition: null
  action: launch
  target: hello
---
apiVersion: v1
kind: Package
metadata:
  label: null
  name: hello
spec:
  pattern:
    - type: plain
  models:
    - name: hello
      node: HPC
      resources:
        volume:
        network:
---
apiVersion: v1
kind: Model
metadata:
  name: hello
  annotations:
    io.pullpiri.annotations.package-type: hello
    io.pullpiri.annotations.package-name: hello
    io.pullpiri.annotations.package-network: default
  labels:
    app: hello
spec:
  hostNetwork: true
  containers:
    - name: world
      image: quay.io/podman/hello:latest
  terminationGracePeriodSeconds: 0
