apiVersion: v1
kind: Scenario
metadata:
  name: helloworld
spec:
  condition: null
  action: launch
  target: helloworld
---
apiVersion: v1
kind: Package
metadata:
  label: null
  name: helloworld
spec:
  schedule: schedule_helloworld
  pattern:
    - type: plain
  policy: policy_helloworld
  models:
    - name: hello
      node: HPC
      resources:
        volume:
        network:
---
apiVersion: v1
kind: Policy
metadata:
  name: policy_helloworld
spec:
  placement:
    availableNodes:
      - HPC
  procedure:
    type: realtime
    strategy: stop
    trigger:
      deadlineMissThreshold:
        count: 5
---
apiVersion: v1
kind: Schedule
metadata:
  name: schedule_helloworld
spec:
  - name: t1
    priority: 50
    policy: FIFO
    cpu_affinity: 0
    period: 10
    release_time: 0
    runtime: 5
    deadline: 10
    node_id: HPC
    max_dmiss: 5
  - name: t2
    priority: 50
    policy: FIFO
    cpu_affinity: 0
    period: 10
    release_time: 0
    runtime: 5
    deadline: 10
    node_id: HPC
    max_dmiss: 5
---
apiVersion: v1
kind: Model
metadata:
  name: hello
  annotations:
    io.pullpiri.annotations.package-type: hello
    io.pullpiri.annotations.package-name: hello
    io.pullpiri.annotations.package-network: default
  labels:
    app: hello
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
    - name: world1
      image: ghcr.io/mco-piccolo/timpani_test:v5
      command: ["./sample_apps"]
      args: ["-p","10","-d","10","-a","3","-l","2000","--bpf","-s","t1"]
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_NICE"]
    - name: world2
      image: ghcr.io/mco-piccolo/timpani_test:v5
      command: ["./sample_apps"]
      args: ["-p","10","-d","10","-a","3","-l","2000","--bpf","-s","t2"]
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_NICE"]
  terminationGracePeriodSeconds: 0
